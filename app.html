<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SlotPlanner Pro ・ 工具箱</title>

<!-- ── 字體 ── -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- ── CDN preconnect(ExcelJS / html2canvas 皆走 jsdelivr)── -->
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

<!-- ── 全站樣式 ── -->
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/theme_additions.css">

<!-- v7.6:Vue 掛載前隱藏 app,避免閃過未編譯的 {{ }} 原始模板 -->
<style>[v-cloak]{display:none !important;}</style>

</head>

<body>

<div id="app" class="app" v-cloak>
  <div class="card-shell">

    <!-- ============ 側邊欄 ============ -->
    <aside class="sidebar" :class="{collapsed: sbCollapsed}">
      <div class="sidebar-title">
        <span class="logo">✧ 工具箱</span>
        <button class="collapse-btn" @click="sbCollapsed = !sbCollapsed"
                :title="sbCollapsed ? '展開側邊欄' : '收合側邊欄'">
          {{ sbCollapsed ? '›' : '‹' }}
        </button>
      </div>
      <div class="nav-btn" :class="{active: page===3}" @click="goPage(3)">
        <span>⚙️</span><span class="nav-label">設定檔編輯器</span>
      </div>
      <div class="nav-divider"></div>
      <div class="nav-btn" :class="{active: page===0}" @click="goPage(0)">
        <span>🗂️</span><span class="nav-label">數據文件相關</span>
      </div>
      <div class="nav-btn" :class="{active: page===4}" @click="goPage(4)">
        <span>📄</span><span class="nav-label">批次處理</span>
      </div>
      <div class="nav-btn" :class="{active: page===5}" @click="goPage(5)">
        <span>📄</span><span class="nav-label">資料比對</span>
      </div>
      <!-- v4.9-b:模擬引擎 nav 與 Pyodide 指示器已移除 —
           模擬改外部程式;A/B 比較移到「數據文件相關 → A/B 結果比較」 -->

      <!-- 側邊欄底部:亮暗切換 -->
      <div style="flex:1"></div>
      <button class="sidebar-theme-btn" @click="cycleTheme" :title="'目前:' + themeLabel">
        <span>{{ themeIcon }}</span>
        <span class="nav-label">{{ themeLabel }}</span>
      </button>
    </aside>

    <!-- ============ 右側內容 ============ -->
    <div class="right">

      <header v-if="page !== 1" class="topbar">
        <div class="title">{{ titles[page] }}</div>
        <div class="topbar-actions">
          <!-- v7.1:行動版主題切換(桌面/平板由 CSS 隱藏,側欄底仍有原鈕)-->
          <button class="topbar-theme-m" @click="cycleTheme"
                  :title="'外觀:' + themeLabel" aria-label="切換外觀">{{ themeIcon }}</button>
        </div>
      </header>

      <!-- ── 整個 content 區接收拖曳（只有 page 0 時生效） ── -->
      <main class="content"
            :class="{'no-pad': page === 1 || page === 3, 'content-drag': isDragging}"
            @dragenter.prevent="onContentDragEnter"
            @dragover.prevent="onContentDragOver"
            @dragleave="onContentDragLeave"
            @drop.prevent="onContentDrop">

        <!-- ─── 頁面 0: 數據文件相關（含子分頁）─── -->
        <div v-if="page===0" :key="0" class="fade-enter">

          <!-- 子分頁列（仿設定檔編輯器的分頁；之後可新增更多數據工具） -->
          <div class="data-tabs" role="tablist">
            <button v-for="t in dataTabs" :key="t.id"
                    class="data-tab"
                    :class="{ active: dataTab===t.id, 'is-soon': !t.ready }"
                    role="tab"
                    :aria-selected="dataTab===t.id"
                    @click="setDataTab(t)">
              <span class="data-tab-icon">{{ t.icon }}</span>
              <span class="data-tab-label">{{ t.name }}</span>
              <span v-if="!t.ready" class="data-tab-soon">即將推出</span>
            </button>
          </div>

        <!-- ── 子分頁:TXT → XLSX ── -->
        <div v-if="dataTab==='txt2xlsx'" class="data-tab-panel">

          <!-- 大拖曳指示覆蓋層（拖曳時顯示） -->
          <div v-if="isDragging" class="drag-overlay">
            <div class="drag-overlay-icon">📂</div>
            <div class="drag-overlay-text">放開以載入 TXT 檔案</div>
          </div>

          <!-- 原本的 drop zone（點擊用） -->
          <div class="drop"
               :class="dropClass"
               @click="triggerPick">
            <div class="icon">{{ dropIcon }}</div>
            <div class="main">{{ dropMain }}</div>
            <div class="sub">{{ dropSub }}</div>
          </div>
          <input ref="fileInput" type="file" accept=".txt" style="display:none" @change="onPickedFile">

          <div style="height:20px"></div>

          <!-- 選擇檔案列 -->
          <div class="field-label">選擇檔案</div>
          <div style="display:flex; gap:8px; margin-bottom:20px;">
            <input class="input" :value="fileInfo ? fileInfo.name : ''"
                   placeholder="請選擇 TXT 檔案" readonly>
            <button class="btn-browse" @click="triggerPick" title="選擇檔案">📁</button>
          </div>

          <!-- 輸出說明卡（取代原本 disabled checkbox 區） -->
          <div class="field-label">輸出設定</div>
          <div class="output-info-card" style="margin-bottom:24px;">
            <div class="output-info-row">
              <span class="output-info-icon">⬇</span>
              <div class="output-info-text">
                <div class="output-info-title">下載到瀏覽器預設資料夾</div>
                <div class="output-info-sub">檔名沿用原 TXT 名稱，副檔名改為 .xlsx</div>
              </div>
            </div>
          </div>

          <!-- 轉換按鈕列 + 篩選按鈕(UI 批 E-4:轉換鈕升級為導引晶片,系統牽著手走)-->
          <div style="display:flex; justify-content:center; align-items:center; gap:12px;">
            <button class="btn btn-filter"
                    @click="openModal"
                    :disabled="!fileInfo"
                    title="篩選輸出內容">
              <span class="btn-filter-icon">⚙</span>
              <span>篩選</span>
              <span v-if="fileInfo" class="filter-badge"
                    :class="filterSummary.sel < filterSummary.tot ? 'active' : ''">
                {{ filterSummary.sel }}/{{ filterSummary.tot }}
              </span>
            </button>

            <button class="cfg-guide-chip data-guide-chip" :class="dataGuideCls"
                    :disabled="isConverting"
                    @click="dataGuideRun">{{ dataGuide.label }}</button>
          </div>

          <div style="height:32px"></div>
        </div><!-- /data-tab-panel: txt2xlsx -->

        <!-- ── 子分頁:A/B 結果比較(v4.9-b:接手原模擬引擎的比較功能)── -->
        <div v-else-if="dataTab==='bcompare'" class="data-tab-panel">
          <b-compare-page @status="onChildStatus"></b-compare-page>
        </div><!-- /data-tab-panel: bcompare -->

        <!-- ── 子分頁:設定檔比對(A.xlsx 設定檔逐 sheet 分區差異)── -->
        <div v-else-if="dataTab==='cfgcompare'" class="data-tab-panel">
          <config-compare-page @status="onChildStatus"></config-compare-page>
        </div><!-- /data-tab-panel: cfgcompare -->

        <!-- ── 子分頁:其他數據工具（開發中）── -->
        <div v-else class="data-tab-panel">
          <div class="placeholder">
            <div class="title">{{ activeDataTab ? activeDataTab.name : '更多功能' }}</div>
            <div class="sub">（功能開發中，敬請期待）</div>
          </div>
        </div><!-- /data-tab-panel: soon -->

        </div><!-- /page 0 -->

        <!-- ─── 頁面 1: Symbol 管理 ─── -->
        <symbol-page v-else-if="page===1" :key="1"
                     :registry="registry"
                     @status="onChildStatus"></symbol-page>

        <!-- ─── 頁面 3: A 設定檔編輯器 ─── -->
        <config-page v-else-if="page===3" :key="3"
                     @status="onChildStatus"></config-page>

        <!-- ─── 頁面 4-5: placeholder ─── -->
        <div v-else :key="page" class="placeholder fade-enter">
          <div class="title">{{ titles[page] }}</div>
          <div class="sub">（功能開發中）</div>
        </div>

      </main>

      <footer class="statusbar">
        <div class="status" :class="status.type">
          <span class="dot"></span>
          <span>{{ status.msg }}</span>
        </div>
      </footer>
    </div>

  </div><!-- card-shell -->

  <!-- ============ 行動版底部導覽（v7.1;桌面/平板由 CSS 隱藏）============ -->
  <nav class="mnav" aria-label="主導覽">
    <button class="mnav-btn" :class="{active: page===3}" @click="goPage(3)">
      <span class="mnav-ico">⚙️</span><span class="mnav-lab">設定檔</span>
    </button>
    <button class="mnav-btn" :class="{active: page===0}" @click="goPage(0)">
      <span class="mnav-ico">🗂️</span><span class="mnav-lab">數據</span>
    </button>
    <button class="mnav-btn" :class="{active: page===4}" @click="goPage(4)">
      <span class="mnav-ico">📄</span><span class="mnav-lab">批次</span>
    </button>
    <button class="mnav-btn" :class="{active: page===5}" @click="goPage(5)">
      <span class="mnav-ico">📊</span><span class="mnav-lab">比對</span>
    </button>
  </nav>

</div><!-- #app -->

<!-- ════════════════════════════════════════════════════════
     篩選 Modal — 掛在 body 直接子層，跳脫 card-shell 的
     backdrop-filter stacking context，position:fixed 才有效
     ════════════════════════════════════════════════════════ -->
<div id="filter-modal-root"></div>

<!-- ── 外部依賴：Vue 3 + ExcelJS（defer：不阻塞 HTML 解析）── -->
<script defer src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script><!-- v8.10:xlsm 後處理(zip 重寫) -->
<script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<!-- ── 應用程式檔案 ── -->
<script defer src="js/registry.js"></script>
<!-- v7.6:行動版邊緣滑動手勢工具(供設定檔/Symbol 抽屜使用) -->
<script defer src="js/mobile-gestures.js"></script>
<!-- 中央連動層(單一真相):必須在 registry 之後、其他分頁之前 -->
<script defer src="js/game-spec.js"></script>
<script defer src="js/parser.js"></script>
<script defer src="js/xlsx.js"></script>
<script defer src="js/symbol.js"></script>
<!-- v4.9-b:slotplanner.js(Pyodide worker + SimPage)已移除 -->

<!-- filter-modal 必須在 app.js 之前載入，
     因為 app.js 啟動時就要連上 SP.modalBus -->
<script defer src="js/filter-modal.js"></script>
<script defer src="js/aconfig-xlsx.js"></script>
<script defer src="js/config-editor/helpers.js"></script>
<script defer src="js/config-editor/mode-kind.js"></script>
<script defer src="js/config-editor/template.js"></script>
<script defer src="js/config-editor/setup.js"></script>
<script defer src="js/config-editor/index.js"></script>
<script defer src="js/docgen.js"></script>
<!-- bcompare 必須在 app.js 之前(app.js 要註冊 b-compare-page)-->
<script defer src="js/bcompare.js"></script>
<!-- config-compare 必須在 app.js 之前(app.js 要註冊 config-compare-page)-->
<script defer src="js/config-compare.js"></script>
<script defer src="js/app.js"></script>

</body>
</html>
